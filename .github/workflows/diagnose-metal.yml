name: Diagnose DXMT Metal shader compilation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metal:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode: /Applications/Xcode_26.6.app
          - runner: macos-15
            xcode: /Applications/Xcode_16.4.app
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Compile the pinned DXMT shader with the selected Metal compiler
        shell: bash
        run: |
          set -uo pipefail
          sudo xcode-select -s '${{ matrix.xcode }}'
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain >/dev/null 2>&1 || true
          xcrun -sdk macosx --find metal
          for name in air_msad air_samplepos air_tessellation; do
            curl --fail --location --retry 3 \
              "https://raw.githubusercontent.com/willfaust/dxmt/ca8a2516d819e7e1f366981825ad1f0d26f80fdd/src/airconv/shaders/$name.metal" \
              -o "$name.metal" || exit
            wc -c "$name.metal"
            echo "Compiling $name"
            xcrun -sdk macosx metal -v -o "$name.air" -c "$name.metal" \
              -std=metal3.1 --target=air64-apple-macos14.0
            status=$?
            echo "$name compile exit status: $status"
            test -s "$name.air"
            output_status=$?
            echo "$name nonempty AIR output: $((1-output_status))"
            if (( status != 0 || output_status != 0 )); then exit 1; fi
          done
